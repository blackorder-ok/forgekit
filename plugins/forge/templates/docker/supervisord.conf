; One supervisor per container. Each service runs as its own Linux user.
; Logs go to the container's stdout and stderr, so `docker compose logs` shows all of them.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:mysqld]
; Port 3306 is bound to 127.0.0.1 only. The init file sets the app user and password from secrets.
command=mysqld --user=mysql --datadir=/var/lib/mysql --bind-address=127.0.0.1 --port=3306
user=mysql
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:ollama]
; Runs only in develop. Other environments use the cloud provider and do not start Ollama.
command=sh -c 'if [ "$APP_ENV" = "develop" ]; then exec /usr/local/bin/ollama serve; else exec sleep infinity; fi'
user=ollama
environment=OLLAMA_HOST="127.0.0.1:11434",OLLAMA_MODELS="/var/lib/ollama/models",HOME="/var/lib/ollama"
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:backend]
; Waits for MySQL, applies migrations, then serves on 127.0.0.1:8000 (nginx proxies /api/ to it).
command=sh -c 'for i in $(seq 60); do mysqladmin ping -h127.0.0.1 --silent && break; sleep 1; done; alembic upgrade head && exec uvicorn app.main:APP --host 127.0.0.1 --port 8000 --workers 2'
user=app
directory=/app/backend
environment=PYTHONPATH="/app/backend",HOME="/var/lib/app"
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
; Master runs as root to bind port 80. Workers drop to www-data (set in nginx.conf).
command=nginx -g "daemon off;"
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
